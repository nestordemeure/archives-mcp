[project]
name = "archives-mcp"
version = "0.1.0"
description = "MCP server for Internet Archive - search and access OCR text from historical documents"
readme = "README.md"
authors = [
    { name = "Nestor Demeure", email = "nestordemeure@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
archives-mcp = "archives_mcp.server:main"
archives-mcp-install = "archives_mcp.install:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
